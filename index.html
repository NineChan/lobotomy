<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOBOTOMY UNLEASHER ONLINE</title>
    <link rel="icon" type="image/png" href="src/images/favicon.png">
    
    <style>
        .permanent-shake {
            display: inline-block;
            animation: lobotomy-vibe 0.15s infinite; 
            color: red;
            font-size: 3rem;
            font-family: sans-serif;
            text-shadow: 2px 2px 5px black;
        }
        @keyframes lobotomy-vibe {
            0% { transform: translate(1px, 1px) rotate(0deg); }
            10% { transform: translate(-1px, -2px) rotate(-1deg); }
            20% { transform: translate(-3px, 0px) rotate(1deg); }
            30% { transform: translate(3px, 2px) rotate(0deg); }
            40% { transform: translate(1px, -1px) rotate(1deg); }
            50% { transform: translate(-1px, 2px) rotate(-1deg); }
            60% { transform: translate(-3px, 1px) rotate(0deg); }
            70% { transform: translate(3px, 1px) rotate(-1deg); }
            80% { transform: translate(-1px, -1px) rotate(1deg); }
            90% { transform: translate(1px, 2px) rotate(0deg); }
            100% { transform: translate(1px, -2px) rotate(-1deg); }
        }
        body {
            background-color: #111;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
        }
    </style>
</head>
<body>
    <h1 class="permanent-shake">LOBOTOMY UNLEASHER ONLINE</h1>
    <img src="tong.png" style="width: 400px; height: 400px;" alt="tong">
</body>
</html>
