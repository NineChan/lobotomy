<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LOBOTOMY UNLEASHER ONLINE</title>
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/png" href="src/images/favicon.png">

    <style>
        /* Стили для анимации тряски */
        .shake-effect {
            display: inline-block; /* Нужно для корректной работы transform */
            animation: shake-anim 0.2s ease-in-out infinite;
        }

        @keyframes shake-anim {
            0% { transform: translate(0, 0) rotate(0deg); }
            25% { transform: translate(-5px, 5px) rotate(-1deg); }
            50% { transform: translate(5px, -5px) rotate(1deg); }
            75% { transform: translate(-5px, -5px) rotate(-1deg); }
            100% { transform: translate(5px, 5px) rotate(1deg); }
        }

        /* Чтобы курсор менялся при наведении */
        h1, img { cursor: pointer; }
    </style>
</head>
<body>

<center>
    <!-- Добавил ID и текст в заголовок -->
    <h1 id="main-title" style="color: red; font-size: 3rem;">
        LOBOTOMY UNLEASHER ONLINE
    </h1>
    
    <br>

    <!-- Добавил событие клика на картинку -->
    <img src="tong.png" 
         onclick="startLobotomy()" 
         style="width: 400px; height: 400px;" 
         alt="tong">
</center>

<script>
    function startLobotomy() {
        const title = document.getElementById('main-title');
        
        // Добавляем класс тряски
        title.classList.add('shake-effect');
        
        // Убираем тряску через 1.5 секунды
        setTimeout(() => {
            title.classList.remove('shake-effect');
        }, 1500);
    }

    // Также запускаем при клике на сам заголовок
    document.getElementById('main-title').onclick = startLobotomy;
</script>

</body>
</html>
